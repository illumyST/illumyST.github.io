<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#F8F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F2124" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a remembered theme before first paint (see src/composables/useTheme.ts).
      try {
        var t = localStorage.getItem('stone-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          var c = t === 'dark' ? '#1F2124' : '#F8F5F0'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c })
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/stone-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/stone-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Zen+Old+Mincho:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap"
    />
    <title>Stone Chen</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
